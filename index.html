    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/avatar.png" />
    <meta property="og:site_name" content="Lorenzo Concas" />

    <meta name="twitter:card" content="summary" />

    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"Person","name":"Lorenzo Concas","url":"https://lorenzoconcas.github.io/","image":"https://lorenzoconcas.github.io/avatar.png","jobTitle":"Sviluppatore","sameAs":["https://github.com/lorenzoconcas"]}
    </script>
    <script>
      // tema salvato (o preferenza di sistema) applicato prima del primo paint
      try {
        var t = localStorage.theme
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
